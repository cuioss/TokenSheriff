# Runs E2E Playwright tests for Dev-UI components via Maven with report deployment.
name: End-to-End Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Required for the GitHub merge queue: without it the queued checks never
  # report and the queue times out (see cuioss-organization v0.8.0).
  merge_group:

permissions:
  contents: read

jobs:
  e2e-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@8e6a0c7cca322b3e3189933a130a1df11e0b08e6 # v0.40.0
    with:
      report-name: e-2-e-playwright
      # The install step skips the frontend plugin (node/npm download, npm install, lint, format
      # check, Jest) of the deployment module: none of it produces packaged output, and the Maven
      # Build workflow keeps enforcing it. The verify step is left alone, because the Playwright
      # module needs node and npm.
      maven-args-input: |
        install -DskipTests -DskipITs -Dskip.installnodenpm -Dskip.npm -T 1C -am -pl bom,token-sheriff-validation,token-sheriff-quarkus-parent,token-sheriff-quarkus-parent/token-sheriff-validation-quarkus,token-sheriff-quarkus-parent/token-sheriff-validation-quarkus-deployment,token-sheriff-quarkus-parent/token-sheriff-quarkus-integration-tests
        verify -Pe2e-tests -pl token-sheriff-quarkus-parent/e-2-e-playwright
      install-playwright: true
      # Every Playwright project in e-2-e-playwright runs Desktop Chrome, so only
      # Chromium and its system packages are installed. Without this the workflow
      # installs the system dependencies of all three browser engines.
      playwright-browsers: chromium
      npm-cache: true
      timeout-minutes: 30
      reports-folder: |
        token-sheriff-quarkus-parent/e-2-e-playwright/target/test-results
      report-logs: |
        token-sheriff-quarkus-parent/e-2-e-playwright/target/quarkus-dev.log
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
