# Configuration is read from .github/project.yml - no inputs needed!
# Path filtering is handled inside the reusable workflow via project.yml settings.
name: Maven Build

on:
  push:
    branches: [main, "release/*", "dependabot/**"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:
  # Required for the GitHub merge queue: without it the queued checks never
  # report and the queue times out (see cuioss-organization v0.8.0).
  merge_group:

permissions:
  contents: read
  pull-requests: read
  actions: read        # the conclusion job verifies a covering run exists

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@5a641e5da90ae209472419a541b7566bf7f4172e # v0.44.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
