# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    ignore:
      # Maven 3.10.0 produces a Central bundle that the Central Portal rejects for modules
      # excluded from publishing (it failed the cui-http 3.2 release, cuioss/cui-http#270). Stay on
      # 3.9.x until https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
      # is resolved.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Only `default-days`: the `semver-*-days` keys are rejected for the
    # github-actions ecosystem, and one rejected key invalidates the whole file,
    # which disables version updates for the entire repo.
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: "/token-sheriff-quarkus-parent/token-sheriff-quarkus-integration-tests"
    schedule:
      interval: "weekly"
    # This ecosystem reads Dockerfiles only; images in docker-compose files are covered by the
    # docker-compose entry below.
    # Only `default-days`: as with github-actions above, the `semver-*-days` keys
    # are rejected for the docker ecosystem and would invalidate the whole file.
    cooldown:
      default-days: 3

  # Keycloak, pinned by tag and digest in both compose files. Only Keycloak is tracked: the other
  # compose images (Prometheus, Dex, Postgres, Zitadel) stay manually pinned. Both compose files
  # mount the same realm imports, so one group keeps them on the same version in a single PR. The
  # bump PR runs the integration and e2e suites, which is what verifies the new release.
  - package-ecosystem: docker-compose
    directories:
      - "/token-sheriff-quarkus-parent/token-sheriff-quarkus-integration-tests"
      - "/token-sheriff-quarkus-parent/e-2-e-playwright"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "quay.io/keycloak/keycloak"
    groups:
      keycloak:
        patterns:
          - "quay.io/keycloak/keycloak"
    # Only `default-days`, for the same reason as the docker ecosystem above.
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: "/token-sheriff-quarkus-parent/token-sheriff-validation-quarkus-deployment"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
