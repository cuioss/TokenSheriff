# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    ignore:
      # Maven 3.10.0 produces a Central bundle that the Central Portal rejects for modules
      # excluded from publishing (it failed the cui-http 3.2 release, cuioss/cui-http#270). Stay on
      # 3.9.x until https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
      # is resolved.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Only `default-days`: the `semver-*-days` keys are rejected for the
    # github-actions ecosystem, and one rejected key invalidates the whole file,
    # which disables version updates for the entire repo.
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: "/token-sheriff-quarkus-parent/token-sheriff-quarkus-integration-tests"
    schedule:
      interval: "weekly"
    # Note: This tracks Dockerfiles only. For docker-compose.yml images,
    # manual updates are required as dependabot's Docker ecosystem
    # doesn't scan compose files. Current versions in docker-compose.yml:
    # - quay.io/keycloak/keycloak:26.4.0
    # - prom/prometheus:v3.6.0
    # Only `default-days`: as with github-actions above, the `semver-*-days` keys
    # are rejected for the docker ecosystem and would invalidate the whole file.
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: "/token-sheriff-quarkus-parent/token-sheriff-validation-quarkus-deployment"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
