# Parallel execution is switched on, but nothing runs concurrently by default: classes and
# methods stay on one thread, in order, unless a class opts in with @Execution(CONCURRENT).
# RefreshProductionPathSpecIT is the one class that does, so that its wait for a real access
# token to expire overlaps the other classes instead of holding the whole run.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# One thread for the sequential classes and one for the class that opts in. A fixed size keeps the
# run the same on every runner, whatever its number of cores.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2

# The class order is set by the failsafe configuration of this module's pom.xml
# (junit.jupiter.testclass.order.default), where it takes precedence over this file.
