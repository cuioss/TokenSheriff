# Test configuration for Token-Sheriff extension
quarkus.log.level=INFO
quarkus.log.category."de.cuioss.sheriff.token".level=DEBUG

# Sample JWT configuration for testing
sheriff.token.issuers.default.issuer-identifier=https://test-auth.example.com
sheriff.token.issuers.default.enabled=true
sheriff.token.issuers.default.audience-validation-disabled=true
# Every enabled issuer needs a JWKS source: TokenValidatorStartupInitializer builds the
# TokenValidator eagerly at boot and fails startup otherwise. Inline content keeps the boot
# network-free. Valid 2048-bit RSA public key (RFC 7638 example); no test signs tokens with it.
sheriff.token.issuers.default.jwks.content={"keys":[{"kty":"RSA","use":"sig","kid":"default-key-1","alg":"RS256","n":"0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM78LhWx4cbbfAAtVT86zwu1RK7aPFFxuhDR1L6tSoc_BJECPebWKRXjBZCiFV4n3oknjhMstn64tZ_2W-5JsGY4Hc5n9yBXArwl93lqt7_RN5w6Cf0h4QyQ5v-65YGjQR0_FDW2QvzqY368QQMicAtaSqzs8KJZgnYb9c7d0zgdAZHzu6qMQvRL5hajrn1n91CbOpbISD08qNLyrdkt-bFTWhAI4vMQFh6WeZu0fM4lFd2NcRwr3XPksINHaQ-G_xBniIqbw0Ls1jF44-csFCur-kEgU8awapJzKnqDKgw","e":"AQAB"}]}

# Parser configuration
sheriff.token.parser.max-token-size=8192
