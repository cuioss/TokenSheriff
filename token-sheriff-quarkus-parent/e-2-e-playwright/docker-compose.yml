# E2E Dev-UI Tests - Keycloak for Quarkus Dev Mode
# Purpose: Provide a Keycloak instance accessible from the host for Dev-UI testing
# NOTE: Keycloak runs with the static public hostname KC_HOSTNAME=https://localhost:1443, the
# same setting as the shared integration-tests compose file. Every URL Keycloak emits (issuer,
# endpoints, redirects) names https://localhost:1443, so tokens carry the issuer
# https://localhost:1443/realms/..., which matches the base issuer-identifier of the
# integration-tests application. The Token-Sheriff %dev config therefore keeps the base
# issuer-identifier unchanged and only points the JWKS URLs at the host-mapped port
# (localhost:1443).

services:
  keycloak:
    # NOTE: Dependabot cannot automatically update this image version.
    # Manual updates required. Check: https://quay.io/keycloak/keycloak
    # Keep in sync with ../token-sheriff-quarkus-integration-tests/docker-compose.yml: both mount the
    # same realm imports.
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/opt/keycloak/certificates/localhost.crt
      - --https-certificate-key-file=/opt/keycloak/certificates/localhost.key
      - --https-port=8443
    ports:
      - "1443:8443"  # External HTTPS port for Keycloak
      - "1090:9000"  # External port for Keycloak management (health checks)
    volumes:
      - ../token-sheriff-quarkus-integration-tests/src/main/docker/keycloak:/opt/keycloak/data/import:ro
      - ../token-sheriff-quarkus-integration-tests/src/main/docker/certificates:/opt/keycloak/certificates:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_LOG_LEVEL=INFO
      - KC_HTTP_ENABLED=false
      - KC_HTTPS_PORT=8443
      # Static public hostname: tokens carry https://localhost:1443, matching the base issuer-identifier.
      - KC_HOSTNAME=https://localhost:1443
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && exec 3<&-"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    networks:
      - e2e-devui

networks:
  e2e-devui:
    driver: bridge
