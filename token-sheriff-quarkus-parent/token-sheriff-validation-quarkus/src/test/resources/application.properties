# Minimal test configuration - test profiles provide the actual JWT configuration
quarkus.log.level=INFO
quarkus.log.category."de.cuioss.jwt".level=DEBUG

# Use a random free HTTP port for @QuarkusTest so the fixed default (8081) cannot collide
# across test JVMs when the reactor runs modules in parallel (-T) and CPU contention delays port
# release. Surefire runs each module in two reused forks (plain tests, and the quarkus-boot group
# that boots Quarkus). @QuarkusTest/RestAssured auto-detect it.
quarkus.http.test-port=0

# JaCoCo coverage configuration for @QuarkusTest
quarkus.jacoco.reuse-data-file=true
# The report is produced by jacoco-maven-plugin (target/site/jacoco); the Quarkus-side
# report only waited for a data file that is never written (target/jacoco-report/error.txt).
quarkus.jacoco.report=false
